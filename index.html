<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306C755'><path d='M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/></svg>">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background-color: #f0f0f0; }

    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box { background: white; padding: 25px; border-radius: 12px; text-align: center; width: 320px; }
    .modal-box input, .modal-box textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
    .modal-box button { background: #06C755; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

    #alert-modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white;
    }
    .alert-card {
      background: #222; border: 3px solid #ff4757; border-radius: 15px; padding: 30px; width: 85%; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
    }

    #sidebar { width: 340px; background: #ffffff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { background: #242a38; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .rename-btn { background: #4a90e2; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .section-title { background: #eee; padding: 6px 12px; font-size: 11px; font-weight: bold; color: #666; border-bottom: 1px solid #ddd; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { display: flex; flex-direction: column; padding: 10px 12px; border-bottom: 1px solid #eee; gap: 5px; }
    .user-row-main { display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #333; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .online { background-color: #06C755; }
    .offline { background-color: #ccc; }
    .ban-badge { background: red; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; }

    .btn { padding: 5px 10px; border-radius: 12px; border: none; font-size: 11px; cursor: pointer; }
    .btn-add { background: #06C755; color: white; }
    .btn-pending { background: #ccc; color: #666; cursor: default; }
    .btn-chat { background: #4a90e2; color: white; }
    .btn-watch { background: #e67e22; color: white; }
    .btn-report { background: #9b59b6; color: white; font-weight: bold; }

    .admin-controls { display: none; background: #fff0f0; padding: 5px; border-radius: 4px; border: 1px dashed red; gap: 4px; font-size: 11px; }
    .admin-controls button { background: #d9534f; color: white; border: none; border-radius: 3px; padding: 2px 5px; cursor: pointer; }

    .admin-code-area { padding: 10px; background: #1e222d; color: white; display: flex; gap: 5px; align-items: center; justify-content: space-between; }
    .admin-code-area input { flex: 1; padding: 6px; border-radius: 4px; border: none; font-size: 12px; }
    .admin-code-area button { background: #e67e22; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

    #chat-container { flex: 1; display: flex; flex-direction: column; background: #8cabd9; }
    .chat-header { background: #242a38; color: white; padding: 12px 15px; font-weight: bold; display: flex; flex-direction: column; gap: 8px; }
    .chat-header-title { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    
    .impersonate-bar { display: none; background: #1a1e29; padding: 8px; border-radius: 6px; align-items: center; gap: 10px; font-size: 12px; }
    .impersonate-btn-group { display: flex; gap: 6px; }
    .imp-user-btn { background: #444; color: white; border: 1px solid #666; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .imp-user-btn.active { background: #06C755; border-color: #06C755; color: white; box-shadow: 0 0 5px rgba(6, 199, 85, 0.6); }

    .message-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    .msg-row { display: flex; flex-direction: column; max-width: 70%; }
    .msg-row.me { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 11px; color: #fff; margin-bottom: 3px; }
    
    .msg-body { display: flex; align-items: flex-end; gap: 5px; }
    .me .msg-body { flex-direction: row; }
    .other .msg-body { flex-direction: row-reverse; }

    .msg-meta { font-size: 10px; color: #e0e0e0; display: flex; flex-direction: column; align-items: flex-end; }
    .read-status { color: #ffffff; font-weight: bold; margin-bottom: 2px; }

    .msg-bubble { padding: 10px 14px; border-radius: 15px; font-size: 14px; word-break: break-all; white-space: pre-wrap; line-height: 1.4; }
    .me .msg-bubble { background: #85e249; color: #000; border-top-right-radius: 2px; }
    .other .msg-bubble { background: #ffffff; color: #000; border-top-left-radius: 2px; }
    .msg-media { max-width: 250px; max-height: 250px; border-radius: 8px; margin-top: 5px; display: block; }

    .input-area { background: #ffffff; padding: 10px; display: flex; gap: 10px; align-items: center; }
    .input-area textarea { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 6px; padding: 8px; resize: none; outline: none; }
    .file-btn-label { font-size: 20px; cursor: pointer; padding: 0 5px; }
    .file-btn-label input { display: none; }
    .send-btn { background: #06C755; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 名前入力モーダル -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3>名前を入力してください</h3>
      <input type="text" id="username-input" placeholder="例: たろう">
      <button onclick="saveName()">はじめる</button>
    </div>
  </div>

  <!-- 管理者用：一斉アナウンス送信モーダル -->
  <div id="broadcast-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
    <div class="modal-box" style="width: 360px;">
      <h3 style="color: #ff4757; margin-bottom: 10px;">📢 全員に一斉アナウンス</h3>
      <textarea id="broadcast-msg-input" placeholder="全員の画面に表示させるメッセージを入力" style="height: 90px;"></textarea>
      
      <div style="margin: 15px 0; font-size: 13px; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 6px;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="broadcast-sound-checkbox" checked style="width: auto; margin: 0;">
          🔊 送信時に警告音を鳴らす
        </label>
      </div>

      <div style="display: flex; gap: 10px;">
        <button onclick="closeBroadcastPrompt()" style="background: #ccc; color: #333;">キャンセル</button>
        <button onclick="submitBroadcastAlert()" style="background: #ff4757;">一斉送信</button>
      </div>
    </div>
  </div>

  <!-- 全画面緊急表示用ポップアップ（受信用） -->
  <div id="alert-modal-overlay">
    <div class="alert-card">
      <h1 id="alert-title" style="color: #ff4757; font-size: 22px; margin-bottom: 15px;">📢 緊急アナウンス</h1>
      <p id="alert-body" style="font-size: 17px; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; font-weight: bold;"></p>
      <button onclick="closeAlertModal()" style="background: #ff4757; color: white; border: none; padding: 12px 30px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;">確認しました</button>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span id="my-name-display">自分: -</span>
      <button class="rename-btn" onclick="changeMyName()">名前変更</button>
    </div>
    
    <div class="user-list" id="user-list-container">

      <!-- 👑 管理者専用エリア -->
      <div id="admin-report-section" style="display: none;">
        <div class="section-title" style="background: #8e44ad; color: white;">👑 管理者コマンド＆専用ルーム</div>
        <div class="user-item" style="background: #f4ecf7;">
          <div class="user-row-main" style="margin-bottom: 5px;">
            <div class="user-info" style="color: #8e44ad;">📢 報告・連絡用チャット</div>
            <button class="btn btn-report" onclick="openReportChat()">開く</button>
          </div>
          <button onclick="openBroadcastPrompt()" style="background: #ff4757; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; width: 100%;">
            ⚡ 全員に一斉アナウンス送信
          </button>
        </div>
      </div>

      <div class="section-title">ユーザー一覧（友達）</div>
      <div id="user-list"></div>

      <!-- 👑 監視対象会話ペア一覧 -->
      <div id="admin-watch-section" style="display: none;">
        <div class="section-title" style="background: #ffeaa7; color: #d35400;">👑 監視可能な会話ペア一覧</div>
        <div id="watch-pair-list"></div>
      </div>
    </div>

    <div class="admin-code-area" id="admin-code-area">
      <input type="password" id="admin-code-input" placeholder="管理者コード">
      <button onclick="submitAdminCode()">実行</button>
    </div>

    <div class="admin-code-area" id="admin-logout-area" style="display: none;">
      <span style="font-size: 12px; color: #2ecc71; font-weight: bold;">👑 管理者モード有効</span>
      <button onclick="logoutAdmin()" style="background: #e74c3c;">モード終了</button>
    </div>
  </div>

  <div id="chat-container">
    <div class="chat-header">
      <div class="chat-header-title" id="chat-header-text">友達を選んでチャットを開始してください</div>
      
      <div class="impersonate-bar" id="impersonate-bar">
        <span>発言者として送信:</span>
        <div class="impersonate-btn-group" id="impersonate-btn-group"></div>
      </div>
    </div>

    <div class="message-area" id="message-area"></div>

    <div class="input-area">
      <label class="file-btn-label" title="ファイルを添付">📎
        <input type="file" id="file-input" onchange="sendFile()">
      </label>
      <textarea id="text-input" placeholder="メッセージを入力"></textarea>
      <button class="send-btn" onclick="sendText()">送信</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myUserId = localStorage.getItem('chat_userid');
    let watchedUserA = null;
    let watchedUserB = null;
    let selectedSenderId = null;
    let isAdmin = false;
    let cachedData = { users: [], chatPairs: [] };
    let alertInterval = null;
    let originalTitle = document.title;

    const defaultIcon = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306C755'><path d='M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/></svg>";
    const alertIcon = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff4757'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z'/></svg>";

    if (!myUserId) {
      myUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      localStorage.setItem('chat_userid', myUserId);
    }

    window.onload = () => {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }

      const savedName = localStorage.getItem('chat_username');
      if (savedName) {
        document.getElementById('modal-overlay').style.display = 'none';
        initUser(savedName);
      }
    };

    window.onfocus = () => {
      if (alertInterval && document.getElementById('alert-modal-overlay').style.display !== 'flex') {
        clearInterval(alertInterval);
        alertInterval = null;
        document.title = originalTitle;
        setFavicon(defaultIcon);
      }
    };

    function saveName() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('名前を入力してください');
      localStorage.setItem('chat_username', name);
      document.getElementById('modal-overlay').style.display = 'none';
      initUser(name);
    }

    function initUser(name) {
      document.getElementById('my-name-display').innerText = `自分: ${name}`;
      
      const savedFriends = JSON.parse(localStorage.getItem('chat_friends_' + myUserId) || '[]');
      const savedRequests = JSON.parse(localStorage.getItem('chat_requests_' + myUserId) || '[]');
      
      socket.emit('register', { 
        userId: myUserId, 
        name: name,
        savedFriends: savedFriends,
        savedRequests: savedRequests
      });
    }

    function changeMyName() {
      const newName = prompt('新しい名前を入力してください:');
      if (newName && newName.trim()) {
        localStorage.setItem('chat_username', newName.trim());
        document.getElementById('my-name-display').innerText = `自分: ${newName.trim()}`;
        socket.emit('change_name', { newName: newName.trim() });
      }
    }

    function submitAdminCode() {
      const code = document.getElementById('admin-code-input').value;
      socket.emit('admin_auth', { code: code });
    }

    function logoutAdmin() {
      socket.emit('admin_logout');
    }

    socket.on('admin_auth_result', ({ success }) => {
      if (success) {
        isAdmin = true;
        document.getElementById('admin-code-area').style.display = 'none';
        document.getElementById('admin-logout-area').style.display = 'flex';
        document.getElementById('admin-watch-section').style.display = 'block';
        document.getElementById('admin-report-section').style.display = 'block';
        updateUserListUI();
        alert('👑 管理者モードを有効化しました');
      } else {
        alert('コードが正しくありません');
      }
    });

    socket.on('admin_logout_result', () => {
      isAdmin = false;
      document.getElementById('admin-code-area').style.display = 'flex';
      document.getElementById('admin-logout-area').style.display = 'none';
      document.getElementById('admin-watch-section').style.display = 'none';
      document.getElementById('admin-report-section').style.display = 'none';
      document.getElementById('impersonate-bar').style.display = 'none';
      document.getElementById('admin-code-input').value = '';
      watchedUserA = null;
      watchedUserB = null;
      selectedSenderId = null;
      updateUserListUI();
      alert('管理者モードを終了しました');
    });

    socket.on('user_list_update', (data) => {
      cachedData = data;
      
      const me = data.users.find(u => u.userId === myUserId);
      if (me) {
        localStorage.setItem('chat_friends_' + myUserId, JSON.stringify(me.friends));
        localStorage.setItem('chat_requests_' + myUserId, JSON.stringify(me.requestsSent));
      }

      updateUserListUI();
    });

    function updateUserListUI() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      const userListElement = document.getElementById('user-list');
      userListElement.innerHTML = '';

      cachedData.users.forEach(user => {
        if (user.userId === myUserId && !isAdmin) return;

        const div = document.createElement('div');
        div.className = 'user-item';

        const rowMain = document.createElement('div');
        rowMain.className = 'user-row-main';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'user-info';
        
        const dot = document.createElement('span');
        dot.className = `status-dot ${user.isOnline ? 'online' : 'offline'}`;
        infoDiv.appendChild(dot);

        const nameSpan = document.createElement('span');
        nameSpan.innerText = user.name + (user.userId === myUserId ? ' (自分)' : '');
        infoDiv.appendChild(nameSpan);

        if (user.isBanned) {
          const banSpan = document.createElement('span');
          banSpan.className = 'ban-badge';
          banSpan.innerText = 'BAN中';
          infoDiv.appendChild(banSpan);
        }
        
        rowMain.appendChild(infoDiv);

        const isFriend = me && me.friends.includes(user.userId);
        const hasSentRequest = me && me.requestsSent.includes(user.userId);

        if (isFriend) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-chat';
          btn.innerText = 'チャット';
          btn.onclick = () => selectPartner(user.userId, user.name);
          rowMain.appendChild(btn);
        } else if (hasSentRequest) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-pending';
          btn.innerText = '申請中';
          rowMain.appendChild(btn);
        } else if (user.userId !== myUserId) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-add';
          btn.innerText = '友達申請';
          btn.onclick = () => socket.emit('send_friend_request', user.userId);
          rowMain.appendChild(btn);
        }

        div.appendChild(rowMain);

        if (isAdmin && user.userId !== myUserId) {
          const adminDiv = document.createElement('div');
          adminDiv.className = 'admin-controls';
          adminDiv.style.display = 'flex';
          adminDiv.innerHTML = `
            <button onclick="adminRename('${user.userId}')">名前改変</button>
            <button onclick="adminBan('${user.userId}')">BAN</button>
          `;
          div.appendChild(adminDiv);
        }

        userListElement.appendChild(div);
      });

      if (isAdmin) {
        const watchPairList = document.getElementById('watch-pair-list');
        watchPairList.innerHTML = '';

        if (cachedData.chatPairs.length === 0) {
          watchPairList.innerHTML = '<div style="padding:10px; font-size:12px; color:#999;">会話履歴がありません</div>';
        }

        cachedData.chatPairs.forEach(pair => {
          const div = document.createElement('div');
          div.className = 'user-item';
          div.style.background = '#fff8e7';

          const row = document.createElement('div');
          row.className = 'user-row-main';

          const info = document.createElement('div');
          info.className = 'user-info';
          info.style.fontSize = '12px';
          info.innerText = `💬 ${pair.userA.name} ↔ ${pair.userB.name}`;
          row.appendChild(info);

          const btn = document.createElement('button');
          btn.className = 'btn btn-watch';
          btn.innerText = '監視チャット';
          btn.onclick = () => watchPair(pair.userA, pair.userB);
          row.appendChild(btn);

          div.appendChild(row);
          watchPairList.appendChild(div);
        });
      }
    }

    function adminRename(targetUserId) {
      const newName = prompt('新しい名前を入力:');
      if (newName) socket.emit('admin_rename_user', { targetUserId, newName });
    }

    function adminBan(targetUserId) {
      const minutes = prompt('何分間使用禁止にしますか？ (分単位):', '5');
      if (minutes && !isNaN(minutes)) socket.emit('admin_ban_user', { targetUserId, minutes: parseFloat(minutes) });
    }

    function openReportChat() {
      watchedUserA = myUserId;
      watchedUserB = 'ADMIN_REPORT_ROOM';
      selectedSenderId = myUserId;

      document.getElementById('chat-header-text').innerText = `📢 管理者 報告・連絡用チャット`;
      document.getElementById('impersonate-bar').style.display = 'none';
      document.getElementById('message-area').innerHTML = '';

      socket.emit('get_chat_history', { partnerId: 'ADMIN_REPORT_ROOM' });
    }

    function selectPartner(partnerId, partnerName) {
      watchedUserA = myUserId;
      watchedUserB = partnerId;
      selectedSenderId = myUserId;

      document.getElementById('chat-header-text').innerText = `${partnerName} とのチャット`;
      document.getElementById('impersonate-bar').style.display = 'none';
      document.getElementById('message-area').innerHTML = '';

      socket.emit('get_chat_history', { partnerId: partnerId });
    }

    function watchPair(userA, userB) {
      watchedUserA = userA.userId;
      watchedUserB = userB.userId;

      document.getElementById('chat-header-text').innerText = `👁️ 監視中: ${userA.name} ↔ ${userB.name}`;
      
      const impBar = document.getElementById('impersonate-bar');
      const btnGroup = document.getElementById('impersonate-btn-group');
      impBar.style.display = 'flex';
      btnGroup.innerHTML = '';

      const btnA = document.createElement('button');
      btnA.className = 'imp-user-btn';
      btnA.innerText = userA.name;
      btnA.onclick = () => setImpersonateUser(userA.userId, btnA);

      const btnB = document.createElement('button');
      btnB.className = 'imp-user-btn';
      btnB.innerText = userB.name;
      btnB.onclick = () => setImpersonateUser(userB.userId, btnB);

      btnGroup.appendChild(btnA);
      btnGroup.appendChild(btnB);

      setImpersonateUser(userA.userId, btnA);

      document.getElementById('message-area').innerHTML = '';
      socket.emit('get_chat_history', { userA: userA.userId, userB: userB.userId });
    }

    function setImpersonateUser(userId, clickedBtn) {
      selectedSenderId = userId;
      const btns = document.querySelectorAll('.imp-user-btn');
      btns.forEach(b => b.classList.remove('active'));
      clickedBtn.classList.add('active');
    }

    socket.on('chat_history', ({ userA, userB, partnerId, messages }) => {
      if (partnerId === 'ADMIN_REPORT_ROOM' && watchedUserB !== 'ADMIN_REPORT_ROOM') return;

      const messageArea = document.getElementById('message-area');
      messageArea.innerHTML = '';
      messages.forEach(msg => renderMessage(msg));
      messageArea.scrollTop = messageArea.scrollHeight;

      if (partnerId !== 'ADMIN_REPORT_ROOM') {
        socket.emit('mark_as_read', { partnerId: watchedUserB, watchedUserA });
      }
    });

    function sendText() {
      const input = document.getElementById('text-input');
      const text = input.value;
      if (!text || !watchedUserB) return;

      const toUserId = (watchedUserB === 'ADMIN_REPORT_ROOM') ? 'ADMIN_REPORT_ROOM' : ((selectedSenderId === watchedUserA) ? watchedUserB : watchedUserA);
      const impersonateUserId = (isAdmin && selectedSenderId !== myUserId && watchedUserB !== 'ADMIN_REPORT_ROOM') ? selectedSenderId : null;

      socket.emit('send_message', {
        toUserId: toUserId,
        text: text,
        file: null,
        impersonateUserId: impersonateUserId
      });
      input.value = '';
    }

    function sendFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file || !watchedUserB) return;

      const toUserId = (watchedUserB === 'ADMIN_REPORT_ROOM') ? 'ADMIN_REPORT_ROOM' : ((selectedSenderId === watchedUserA) ? watchedUserB : watchedUserA);
      const impersonateUserId = (isAdmin && selectedSenderId !== myUserId && watchedUserB !== 'ADMIN_REPORT_ROOM') ? selectedSenderId : null;

      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('send_message', {
          toUserId: toUserId,
          text: '',
          file: { name: file.name, type: file.type, data: e.target.result },
          impersonateUserId: impersonateUserId
        });
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    }

    // 📩 メッセージ受信時の処理（個人チャットの通知判定を確実化）
    socket.on('receive_message', (msg) => {
      const isCurrentPair = (watchedUserB === 'ADMIN_REPORT_ROOM' && msg.toUserId === 'ADMIN_REPORT_ROOM') ||
                          (msg.fromUserId === watchedUserA && msg.toUserId === watchedUserB) ||
                          (msg.fromUserId === watchedUserB && msg.toUserId === watchedUserA);

      // 他人からのメッセージで、別のチャットを開いているか、タブが非表示なら通知を起動
      if (msg.fromUserId !== myUserId && (!isCurrentPair || document.hidden)) {
        playBeepSound();
        
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(`${msg.fromName} からメッセージ`, {
            body: msg.text || (msg.file ? 'ファイルを送信しました' : '新着メッセージ'),
            icon: defaultIcon
          });
        }

        startTabNotification(`💬 ${msg.fromName}`);
      }

      if (!isCurrentPair) return;

      renderMessage(msg);
      const messageArea = document.getElementById('message-area');
      messageArea.scrollTop = messageArea.scrollHeight;
    });

    function openBroadcastPrompt() {
      document.getElementById('broadcast-modal-overlay').style.display = 'flex';
    }

    function closeBroadcastPrompt() {
      document.getElementById('broadcast-modal-overlay').style.display = 'none';
      document.getElementById('broadcast-msg-input').value = '';
    }

    function submitBroadcastAlert() {
      const msg = document.getElementById('broadcast-msg-input').value.trim();
      const playSound = document.getElementById('broadcast-sound-checkbox').checked;

      if (!msg) return alert('メッセージを入力してください');

      socket.emit('admin_broadcast_alert', { message: msg, playSound: playSound });
      closeBroadcastPrompt();
    }

    function setFavicon(url) {
      let link = document.querySelector("link[rel*='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = url;
    }

    function startTabNotification(text) {
      if (alertInterval) clearInterval(alertInterval);
      let toggle = false;
      alertInterval = setInterval(() => {
        toggle = !toggle;
        document.title = toggle ? text : "【新着あり！】";
        setFavicon(toggle ? alertIcon : defaultIcon);
      }, 600);
    }

    socket.on('receive_broadcast_alert', ({ title, message, playSound }) => {
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-body').innerText = message;
      document.getElementById('alert-modal-overlay').style.display = 'flex';

      if (playSound) playBeepSound();

      startTabNotification("【📢緊急アナウンス】");

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: message,
          icon: alertIcon,
          requireInteraction: true
        });
      }
    });

    function closeAlertModal() {
      document.getElementById('alert-modal-overlay').style.display = 'none';
      if (alertInterval) {
        clearInterval(alertInterval);
        alertInterval = null;
      }
      document.title = originalTitle;
      setFavicon(defaultIcon);
    }

    function playBeepSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    socket.on('error_message', (msg) => alert(msg));

    function renderMessage(msg) {
      const messageArea = document.getElementById('message-area');
      const isRightSide = msg.fromUserId === (isAdmin ? watchedUserA : myUserId);

      const row = document.createElement('div');
      row.className = `msg-row ${isRightSide ? 'me' : 'other'}`;

      if (!isRightSide || watchedUserB === 'ADMIN_REPORT_ROOM') {
        const sender = document.createElement('div');
        sender.className = 'msg-sender';
        sender.innerText = msg.fromName;
        row.appendChild(sender);
      }

      const body = document.createElement('div');
      body.className = 'msg-body';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (msg.text) bubble.innerText = msg.text;

      if (msg.file) {
        if (msg.file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = msg.file.data;
          img.className = 'msg-media';
          bubble.appendChild(img);
        } else if (msg.file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = msg.file.data;
          video.controls = true;
          video.className = 'msg-media';
          bubble.appendChild(video);
        } else {
          const a = document.createElement('a');
          a.href = msg.file.data;
          a.download = msg.file.name;
          a.innerText = `📎 ${msg.file.name} をダウンロード`;
          a.style.color = isRightSide ? '#000' : '#0066cc';
          bubble.appendChild(a);
        }
      }

      const meta = document.createElement('div');
      meta.className = 'msg-meta';

      if (isRightSide && msg.read && watchedUserB !== 'ADMIN_REPORT_ROOM') {
        const readSpan = document.createElement('span');
        readSpan.className = 'read-status';
        readSpan.innerText = '既読';
        meta.appendChild(readSpan);
      }

      const timeSpan = document.createElement('span');
      timeSpan.className = 'msg-time';
      timeSpan.innerText = msg.time;
      meta.appendChild(timeSpan);

      body.appendChild(bubble);
      body.appendChild(meta);
      row.appendChild(body);

      messageArea.appendChild(row);
    }
  </script>
</body>
</html>
