<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f5f5f5; overflow: hidden; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box { background: white; padding: 25px; border-radius: 12px; text-align: center; width: 340px; max-height: 90vh; overflow-y: auto; }
    .modal-box input, .modal-box textarea, .modal-box select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
    .modal-box button { background: #06C755; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }

    #alert-modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white;
    }
    .alert-card { background: #222; border: 3px solid #ff4757; border-radius: 15px; padding: 30px; width: 85%; max-width: 500px; text-align: center; }

    #navbar { width: 60px; background: #2c3440; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; z-index: 10; }
    .nav-item { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a99ad; cursor: pointer; font-size: 20px; transition: 0.2s; }
    .nav-item:hover, .nav-item.active { color: white; background: #3d4756; }

    #sidebar { width: 320px; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .tab-content { display: none; flex-direction: column; height: 100%; }
    .tab-content.active { display: flex; }

    .sidebar-header { padding: 15px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fbfbfb; }

    .profile-card { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
    .profile-avatar { width: 48px; height: 48px; border-radius: 50%; background: #06C755; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; flex-shrink: 0; background-size: cover; background-position: center; }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .coin-badge { display: inline-block; background: #ffeaa7; color: #d35400; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-top: 3px; }

    .section-title { background: #f0f0f0; padding: 6px 15px; font-size: 11px; font-weight: bold; color: #777; border-bottom: 1px solid #e5e5e5; }
    .item-list { flex: 1; overflow-y: auto; }

    .list-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f5f5f5; gap: 12px; cursor: pointer; }
    .list-item:hover { background: #f8f9fa; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; flex-shrink: 0; background-size: cover; background-position: center; position: relative; }
    .avatar.online::after { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; background: #06C755; border-radius: 50%; border: 2px solid white; }

    .item-body { flex: 1; min-width: 0; }
    .item-title { font-weight: bold; font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-sm { padding: 4px 10px; border-radius: 12px; border: none; font-size: 11px; cursor: pointer; font-weight: bold; }
    .btn-add { background: #06C755; color: white; }
    .btn-disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }

    .stamp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .stamp-card { border: 1px solid #eee; border-radius: 8px; padding: 10px; text-align: center; background: #fff; }
    .stamp-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 5px; }

    #chat-container { flex: 1; display: flex; flex-direction: column; background-color: #7293c2; background-size: cover; background-position: center; }
    .chat-header { background: #ffffff; color: #333; padding: 12px 15px; font-weight: bold; border-bottom: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 6px; }

    .impersonate-bar { display: none; background: #1a1e29; color: white; padding: 6px 10px; border-radius: 6px; align-items: center; gap: 10px; font-size: 12px; }
    .imp-user-btn { background: #444; color: white; border: 1px solid #666; padding: 3px 8px; border-radius: 10px; cursor: pointer; font-size: 11px; }
    .imp-user-btn.active { background: #06C755; border-color: #06C755; }

    .message-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .msg-row { display: flex; flex-direction: column; max-width: 70%; }
    .msg-row.me { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 11px; color: #ffffff; margin-bottom: 3px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

    .msg-body { display: flex; align-items: flex-end; gap: 5px; }
    .msg-meta { font-size: 10px; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: flex-end; }

    .msg-bubble { padding: 9px 13px; border-radius: 15px; font-size: 14px; word-break: break-all; white-space: pre-wrap; line-height: 1.4; }
    .me .msg-bubble { background: #85e249; color: #000; border-top-right-radius: 2px; }
    .other .msg-bubble { background: #ffffff; color: #000; border-top-left-radius: 2px; }

    .msg-stamp { width: 120px; height: 120px; object-fit: contain; }
    .msg-media { max-width: 220px; max-height: 220px; border-radius: 8px; }

    .input-area { background: #ffffff; padding: 10px 15px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #eee; position: relative; }
    .input-area textarea { flex: 1; height: 38px; border: 1px solid #e0e0e0; border-radius: 18px; padding: 9px 15px; resize: none; outline: none; font-size: 14px; background: #f8f9fa; }
    .action-icon { font-size: 22px; cursor: pointer; color: #666; }
    .action-icon input { display: none; }
    .send-btn { background: #06C755; color: white; border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 13px; }

    #stamp-picker { display: none; position: absolute; bottom: 60px; left: 10px; background: white; border: 1px solid #ccc; border-radius: 10px; padding: 10px; width: 280px; max-height: 200px; overflow-y: auto; grid-template-columns: repeat(3, 1fr); gap: 10px; z-index: 100; }
    #stamp-picker img { width: 100%; height: 70px; object-fit: contain; cursor: pointer; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- 名前初期化 -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <h3>名前を入力（最大20文字）</h3>
      <input type="text" id="username-input" maxlength="20" placeholder="例: たろう">
      <button onclick="saveName()">はじめる</button>
    </div>
  </div>

  <!-- プロフィール・背景変更 -->
  <div id="profile-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>🎨 プロフィール＆背景設定</h3>
      <div style="text-align: left; font-size: 12px; margin-top: 10px;">名前:</div>
      <input type="text" id="edit-name-input" maxlength="20">
      <div style="text-align: left; font-size: 12px; margin-top: 5px;">アイコン画像:</div>
      <input type="file" id="edit-avatar-file" accept="image/*">
      <div style="text-align: left; font-size: 12px; margin-top: 5px;">トーク画面背景画像:</div>
      <input type="file" id="edit-bg-file" accept="image/*">
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button onclick="closeProfileModal()" style="background: #ccc; color: #333;">キャンセル</button>
        <button onclick="submitProfileChanges()">保存</button>
      </div>
    </div>
  </div>

  <!-- スタンプ作成 (マイナス防止 min="0") -->
  <div id="create-stamp-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>🎨 スタンプ自作＆販売</h3>
      <input type="text" id="stamp-name-input" placeholder="スタンプ名">
      <input type="number" id="stamp-price-input" placeholder="価格 (コイン)" value="50" min="0">
      <div style="text-align: left; font-size: 12px; margin-top: 5px;">スタンプ画像:</div>
      <input type="file" id="stamp-image-file" accept="image/*">
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button onclick="closeStampModal()" style="background: #ccc; color: #333;">キャンセル</button>
        <button onclick="submitNewStamp()">出品・登録</button>
      </div>
    </div>
  </div>

  <!-- 緊急アナウンス -->
  <div id="alert-modal-overlay">
    <div class="alert-card">
      <h1 id="alert-title" style="color: #ff4757; font-size: 20px; margin-bottom: 10px;">📢 お知らせ</h1>
      <p id="alert-body" style="font-size: 14px; margin-bottom: 20px; white-space: pre-wrap; font-weight: bold;"></p>
      <button onclick="closeAlertModal()" style="background: #ff4757; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-weight: bold;">確認</button>
    </div>
  </div>

  <!-- ナビゲーションバー (👑常時表示) -->
  <div id="navbar">
    <div class="nav-item active" title="ホーム" onclick="switchTab('tab-home', this)">🏠</div>
    <div class="nav-item" title="トーク" onclick="switchTab('tab-chats', this)">💬</div>
    <div class="nav-item" title="スタンプショップ" onclick="switchTab('tab-shop', this)">🎨</div>
    <div class="nav-item" title="ミッション" onclick="switchTab('tab-missions', this)">🎯</div>
    <div class="nav-item" title="管理者パネル" onclick="switchTab('tab-admin', this)">👑</div>
  </div>

  <!-- サイドバー -->
  <div id="sidebar">

    <!-- TAB 1: ホーム -->
    <div id="tab-home" class="tab-content active">
      <div class="sidebar-header">ホーム</div>
      <div class="profile-card">
        <div class="profile-avatar" id="my-avatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="my-name-display">ユーザー名</div>
          <div class="coin-badge">💰 <span id="my-coins-display">0</span> コイン</div>
          <div><button onclick="openProfileModal()" style="background: none; border: none; color: #4a90e2; font-size: 11px; cursor: pointer; margin-top: 4px;">プロフィール・背景設定</button></div>
        </div>
      </div>
      <div class="section-title">友達リスト</div>
      <div class="item-list" id="home-friends-list"></div>
      <div class="section-title">知り合いかも</div>
      <div class="item-list" id="home-others-list"></div>
    </div>

    <!-- TAB 2: トーク一覧 -->
    <div id="tab-chats" class="tab-content">
      <div class="sidebar-header">トーク</div>
      <div class="item-list" id="chat-threads-list"></div>
    </div>

    <!-- TAB 3: スタンプショップ -->
    <div id="tab-shop" class="tab-content">
      <div class="sidebar-header">
        <span>スタンプショップ</span>
        <button onclick="openStampModal()" style="font-size: 11px; background: #06C755; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">＋ 自作・販売</button>
      </div>
      <div class="stamp-grid" id="stamp-shop-grid"></div>
    </div>

    <!-- TAB 4: 無尽蔵ミッション -->
    <div id="tab-missions" class="tab-content">
      <div class="sidebar-header">🎯 無限ミッション</div>
      <div class="item-list" id="missions-list"></div>
    </div>

    <!-- TAB 5: 管理者モード (明確な入力フォーム) -->
    <div id="tab-admin" class="tab-content">
      <div class="sidebar-header">👑 管理者パネル</div>
      <div style="padding: 15px;">
        <div id="admin-login-box">
          <div style="font-size: 12px; margin-bottom: 5px; font-weight: bold;">管理者パスワード入力:</div>
          <input type="password" id="admin-code-input" placeholder="パスワードを入力" style="width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <button onclick="submitAdminCode()" style="width: 100%; background: #e67e22; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;">ログイン</button>
        </div>
        <div id="admin-active-box" style="display: none;">
          <div style="color: #27ae60; font-weight: bold; font-size: 12px; margin-bottom: 8px;">🔓 管理者権限認証済み</div>
          <button onclick="openReportChat()" style="width: 100%; background: #8e44ad; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px;">📢 通報・報告ルーム</button>
          <button onclick="openBroadcastPrompt()" style="width: 100%; background: #ff4757; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 12px;">⚡ 全員に一斉アナウンス</button>
          <button onclick="logoutAdmin()" style="width: 100%; background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">ログアウト</button>
        </div>
      </div>
      <div class="section-title">ユーザー管理 & コイン変更</div>
      <div class="item-list" id="admin-user-list"></div>
    </div>

  </div>

  <!-- チャット画面 -->
  <div id="chat-container">
    <div class="chat-header">
      <div class="chat-header-title" id="chat-header-text">トーク相手を選択してください</div>
      <div class="impersonate-bar" id="impersonate-bar">
        <span>発言者切替(なりすまし):</span>
        <div id="impersonate-btn-group" style="display: flex; gap: 5px;"></div>
      </div>
    </div>

    <div class="message-area" id="message-area"></div>
    <div id="stamp-picker"></div>

    <div class="input-area">
      <span class="action-icon" title="スタンプ" onclick="toggleStampPicker()">😊</span>
      <label class="action-icon" title="ファイル添付">📎
        <input type="file" id="file-input" onchange="sendFile()">
      </label>
      <textarea id="text-input" placeholder="メッセージを入力 (+5コイン)"></textarea>
      <button class="send-btn" onclick="sendText()">送信</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myUserId = localStorage.getItem('chat_userid');
    let watchedUserA = null;
    let watchedUserB = null;
    let selectedSenderId = null;
    let isAdmin = false;
    let cachedData = { users: [], chatPairs: [], messages: [] };
    let allStamps = [];

    if (!myUserId) {
      myUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      localStorage.setItem('chat_userid', myUserId);
    }

    window.onload = () => {
      const savedName = localStorage.getItem('chat_username');
      if (savedName) {
        document.getElementById('modal-overlay').style.display = 'none';
        initUser(savedName);
      }
    };

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    function saveName() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('名前を入力してください');
      localStorage.setItem('chat_username', name.slice(0, 20));
      document.getElementById('modal-overlay').style.display = 'none';
      initUser(name.slice(0, 20));
    }

    function initUser(name) {
      document.getElementById('my-name-display').innerText = name;
      const savedFriends = JSON.parse(localStorage.getItem('chat_friends_' + myUserId) || '[]');
      const savedRequests = JSON.parse(localStorage.getItem('chat_requests_' + myUserId) || '[]');

      socket.emit('register', { userId: myUserId, name: name, savedFriends, savedRequests });
    }

    function openProfileModal() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      if (me) document.getElementById('edit-name-input').value = me.name;
      document.getElementById('profile-modal-overlay').style.display = 'flex';
    }
    function closeProfileModal() { document.getElementById('profile-modal-overlay').style.display = 'none'; }

    function submitProfileChanges() {
      const newName = document.getElementById('edit-name-input').value.trim();
      const avatarFile = document.getElementById('edit-avatar-file').files[0];
      const bgFile = document.getElementById('edit-bg-file').files[0];

      const readFiles = async () => {
        let avatarBase64 = avatarFile ? await toBase64(avatarFile) : undefined;
        let bgBase64 = bgFile ? await toBase64(bgFile) : undefined;

        socket.emit('update_profile', { name: newName, avatar: avatarBase64, bgImage: bgBase64 });
        closeProfileModal();
      };
      readFiles();
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    socket.on('profile_updated_success', ({ name, avatar, bgImage }) => {
      if (name) {
        localStorage.setItem('chat_username', name);
        document.getElementById('my-name-display').innerText = name;
      }
      if (bgImage) document.getElementById('chat-container').style.backgroundImage = `url(${bgImage})`;
    });

    // 管理者認証
    function submitAdminCode() {
      const code = document.getElementById('admin-code-input').value;
      socket.emit('admin_auth', { code });
    }
    function logoutAdmin() { socket.emit('admin_logout'); }

    socket.on('admin_auth_result', ({ success }) => {
      if (success) {
        isAdmin = true;
        document.getElementById('admin-login-box').style.display = 'none';
        document.getElementById('admin-active-box').style.display = 'block';
        updateUI();
        alert('👑 管理者モードでログインしました');
      } else {
        alert('パスワードが違います');
      }
    });

    socket.on('admin_logout_result', () => {
      isAdmin = false;
      document.getElementById('admin-login-box').style.display = 'block';
      document.getElementById('admin-active-box').style.display = 'none';
      document.getElementById('impersonate-bar').style.display = 'none';
      updateUI();
    });

    socket.on('user_list_update', (data) => {
      cachedData = data;
      const me = data.users.find(u => u.userId === myUserId);
      if (me) {
        document.getElementById('my-coins-display').innerText = me.coins || 0;
        document.getElementById('my-avatar').innerText = me.avatar ? '' : me.name.charAt(0);
        if (me.avatar) document.getElementById('my-avatar').style.backgroundImage = `url(${me.avatar})`;
        if (me.bgImage) document.getElementById('chat-container').style.backgroundImage = `url(${me.bgImage})`;
      }
      updateUI();
    });

    socket.on('update_stamps_list', (stamps) => {
      allStamps = stamps;
      renderStampShop();
      renderStampPicker();
    });

    function updateUI() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      const friendsList = document.getElementById('home-friends-list');
      const othersList = document.getElementById('home-others-list');
      const chatThreadsList = document.getElementById('chat-threads-list');

      friendsList.innerHTML = '';
      othersList.innerHTML = '';
      chatThreadsList.innerHTML = '';

      cachedData.users.forEach(user => {
        if (user.userId === myUserId) return;
        const isFriend = me && me.friends.includes(user.userId);
        const hasSentRequest = me && me.requestsSent.includes(user.userId);

        const item = document.createElement('div');
        item.className = 'list-item';
        const avatarStyle = user.avatar ? `background-image: url(${user.avatar});` : '';
        item.innerHTML = `
          <div class="avatar ${user.isOnline ? 'online' : ''}" style="${avatarStyle}">${user.avatar ? '' : user.name.charAt(0)}</div>
          <div class="item-body">
            <div class="item-title">${user.name}</div>
            <div class="item-sub">${user.isOnline ? 'オンライン' : 'オフライン'}</div>
          </div>
        `;

        if (isFriend) {
          item.onclick = () => selectPartner(user.userId, user.name);
          friendsList.appendChild(item);

          const threadItem = item.cloneNode(true);
          threadItem.onclick = () => selectPartner(user.userId, user.name);
          chatThreadsList.appendChild(threadItem);
        } else {
          const btn = document.createElement('button');
          btn.className = `btn-sm ${hasSentRequest ? 'btn-disabled' : 'btn-add'}`;
          btn.innerText = hasSentRequest ? '申請中' : '追加';
          if (!hasSentRequest) {
            btn.onclick = (e) => {
              e.stopPropagation();
              socket.emit('send_friend_request', user.userId);
            };
          }
          item.appendChild(btn);
          othersList.appendChild(item);
        }
      });

      // 👑 管理者パネル: 各ユーザーのコイン変更フォーム
      if (isAdmin) {
        const adminUserList = document.getElementById('admin-user-list');
        adminUserList.innerHTML = '';

        cachedData.users.forEach(user => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.style.flexDirection = 'column';
          item.style.alignItems = 'flex-start';

          item.innerHTML = `
            <div style="display:flex; width:100%; justify-content:space-between; align-items:center;">
              <span style="font-weight:bold;">${user.name} (${user.userId === myUserId ? '自分' : 'ユーザー'})</span>
              <span style="font-size:11px; color:#e67e22;">現在: 💰${user.coins}</span>
            </div>
            <div style="display:flex; gap:5px; width:100%; margin-top:5px;">
              <input type="number" id="coin-input-${user.userId}" value="${user.coins}" style="flex:1; padding:4px; font-size:12px; border:1px solid #ccc; border-radius:4px;">
              <button class="btn-sm btn-add" onclick="setCoins('${user.userId}')">コイン変更</button>
              <button class="btn-sm" style="background:#e74c3c; color:white;" onclick="adminBanUser('${user.userId}')">BAN</button>
            </div>
          `;
          adminUserList.appendChild(item);
        });
      }

      renderMissions();
      renderStampShop();
      renderStampPicker();
    }

    function renderMissions() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      const list = document.getElementById('missions-list');
      if (!list || !me || !me.missions) return;
      list.innerHTML = '';

      me.missions.forEach(m => {
        const isReady = m.current >= m.goal;
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="item-body">
            <div class="item-title">${m.title} (${m.current}/${m.goal})</div>
            <div class="item-sub">報酬: 💰 ${m.reward} コイン</div>
          </div>
          <button class="btn-sm ${isReady ? 'btn-add' : 'btn-disabled'}" ${isReady ? '' : 'disabled'} onclick="claimMission('${m.id}')">
            ${isReady ? '受取' : '未達成'}
          </button>
        `;
        list.appendChild(item);
      });
    }

    function selectPartner(partnerId, partnerName) {
      watchedUserA = myUserId;
      watchedUserB = partnerId;
      selectedSenderId = myUserId;

      document.getElementById('chat-header-text').innerText = partnerName;
      document.getElementById('impersonate-bar').style.display = 'none';
      document.getElementById('message-area').innerHTML = '';

      socket.emit('get_chat_history', { partnerId });
    }

    function openReportChat() {
      watchedUserA = myUserId;
      watchedUserB = 'ADMIN_REPORT_ROOM';
      selectedSenderId = myUserId;

      document.getElementById('chat-header-text').innerText = `📢 通報・報告用チャット`;
      document.getElementById('impersonate-bar').style.display = 'none';
      document.getElementById('message-area').innerHTML = '';

      socket.emit('get_chat_history', { partnerId: 'ADMIN_REPORT_ROOM' });
    }

    socket.on('chat_history', ({ partnerId, messages }) => {
      const messageArea = document.getElementById('message-area');
      messageArea.innerHTML = '';
      messages.forEach(msg => renderMessage(msg));
      messageArea.scrollTop = messageArea.scrollHeight;

      if (partnerId !== 'ADMIN_REPORT_ROOM') {
        socket.emit('mark_as_read', { partnerId: watchedUserB, watchedUserA });
      }
    });

    function sendText() {
      const input = document.getElementById('text-input');
      const text = input.value;
      if (!text || !watchedUserB) return;

      const toUserId = (watchedUserB === 'ADMIN_REPORT_ROOM') ? 'ADMIN_REPORT_ROOM' : ((selectedSenderId === watchedUserA) ? watchedUserB : watchedUserA);
      const impersonateUserId = (isAdmin && selectedSenderId !== myUserId && watchedUserB !== 'ADMIN_REPORT_ROOM') ? selectedSenderId : null;

      socket.emit('send_message', { toUserId, text, file: null, stampUrl: null, impersonateUserId });
      input.value = '';
    }

    function sendStamp(stampUrl) {
      if (!watchedUserB) return alert('トーク相手を選択してください');
      const toUserId = (watchedUserB === 'ADMIN_REPORT_ROOM') ? 'ADMIN_REPORT_ROOM' : ((selectedSenderId === watchedUserA) ? watchedUserB : watchedUserA);
      const impersonateUserId = (isAdmin && selectedSenderId !== myUserId && watchedUserB !== 'ADMIN_REPORT_ROOM') ? selectedSenderId : null;

      socket.emit('send_message', { toUserId, text: '', file: null, stampUrl, impersonateUserId });
      document.getElementById('stamp-picker').style.display = 'none';
    }

    function sendFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file || !watchedUserB) return;

      const toUserId = (watchedUserB === 'ADMIN_REPORT_ROOM') ? 'ADMIN_REPORT_ROOM' : ((selectedSenderId === watchedUserA) ? watchedUserB : watchedUserA);
      const impersonateUserId = (isAdmin && selectedSenderId !== myUserId && watchedUserB !== 'ADMIN_REPORT_ROOM') ? selectedSenderId : null;

      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('send_message', { toUserId, text: '', file: { name: file.name, type: file.type, data: e.target.result }, stampUrl: null, impersonateUserId });
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    }

    socket.on('receive_message', (msg) => {
      const isCurrentPair = (watchedUserB === 'ADMIN_REPORT_ROOM' && msg.toUserId === 'ADMIN_REPORT_ROOM') ||
                          (msg.fromUserId === watchedUserA && msg.toUserId === watchedUserB) ||
                          (msg.fromUserId === watchedUserB && msg.toUserId === watchedUserA);

      if (!isCurrentPair) return;
      renderMessage(msg);
      const messageArea = document.getElementById('message-area');
      messageArea.scrollTop = messageArea.scrollHeight;
    });

    function renderMessage(msg) {
      const messageArea = document.getElementById('message-area');
      const isRightSide = msg.fromUserId === (isAdmin ? watchedUserA : myUserId);

      const row = document.createElement('div');
      row.className = `msg-row ${isRightSide ? 'me' : 'other'}`;

      if (!isRightSide || watchedUserB === 'ADMIN_REPORT_ROOM') {
        const sender = document.createElement('div');
        sender.className = 'msg-sender';
        sender.innerText = msg.fromName;
        row.appendChild(sender);
      }

      const body = document.createElement('div');
      body.className = 'msg-body';
      const bubble = document.createElement('div');

      if (msg.stampUrl) {
        const img = document.createElement('img');
        img.src = msg.stampUrl;
        img.className = 'msg-stamp';
        bubble.appendChild(img);
      } else {
        bubble.className = 'msg-bubble';
        if (msg.text) bubble.innerText = msg.text;
        if (msg.file) {
          if (msg.file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = msg.file.data;
            img.className = 'msg-media';
            bubble.appendChild(img);
          } else {
            const a = document.createElement('a');
            a.href = msg.file.data;
            a.download = msg.file.name;
            a.innerText = `📎 ${msg.file.name}`;
            bubble.appendChild(a);
          }
        }
      }

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (isRightSide && msg.read && watchedUserB !== 'ADMIN_REPORT_ROOM') {
        const readSpan = document.createElement('span');
        readSpan.innerText = '既読';
        meta.appendChild(readSpan);
      }

      const timeSpan = document.createElement('span');
      timeSpan.innerText = msg.time;
      meta.appendChild(timeSpan);

      body.appendChild(bubble);
      body.appendChild(meta);
      row.appendChild(body);
      messageArea.appendChild(row);
    }

    function openStampModal() { document.getElementById('create-stamp-modal').style.display = 'flex'; }
    function closeStampModal() { document.getElementById('create-stamp-modal').style.display = 'none'; }

    async function submitNewStamp() {
      const name = document.getElementById('stamp-name-input').value.trim();
      const price = Math.max(0, parseInt(document.getElementById('stamp-price-input').value) || 0);
      const file = document.getElementById('stamp-image-file').files[0];

      if (!name || !file) return alert('スタンプ名と画像を選択してください');

      const imageUrl = await toBase64(file);
      socket.emit('create_stamp', { name, imageUrl, price });
      closeStampModal();
    }

    function renderStampShop() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      const grid = document.getElementById('stamp-shop-grid');
      if (!grid) return;
      grid.innerHTML = '';

      allStamps.forEach(stamp => {
        const isOwned = me && me.ownedStamps && me.ownedStamps.includes(stamp.id);
        const card = document.createElement('div');
        card.className = 'stamp-card';
        card.innerHTML = `
          <img src="${stamp.imageUrl}">
          <div style="font-size:12px; font-weight:bold;">${stamp.name}</div>
          <div style="font-size:11px; color:#e67e22; margin: 3px 0;">💰 ${stamp.price}</div>
          <button class="btn-sm ${isOwned ? 'btn-disabled' : 'btn-add'}" style="width:100%;" ${isOwned ? 'disabled' : ''} onclick="buyStamp('${stamp.id}')">
            ${isOwned ? '所有済み' : '購入'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function buyStamp(stampId) { socket.emit('buy_stamp', stampId); }

    function toggleStampPicker() {
      const picker = document.getElementById('stamp-picker');
      picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid';
    }

    function renderStampPicker() {
      const me = cachedData.users.find(u => u.userId === myUserId);
      const picker = document.getElementById('stamp-picker');
      if (!picker) return;
      picker.innerHTML = '';

      if (me && me.ownedStamps) {
        me.ownedStamps.forEach(sId => {
          const stamp = allStamps.find(s => s.id === sId);
          if (stamp) {
            const img = document.createElement('img');
            img.src = stamp.imageUrl;
            img.onclick = () => sendStamp(stamp.imageUrl);
            picker.appendChild(img);
          }
        });
      }
    }

    function claimMission(missionId) { socket.emit('claim_mission', missionId); }

    // 👑 管理者操作: コイン変更
    function setCoins(targetUserId) {
      const amount = document.getElementById(`coin-input-${targetUserId}`).value;
      socket.emit('admin_set_coins', { targetUserId, amount });
    }

    function adminBanUser(targetUserId) {
      const mins = prompt('何分間BANしますか？', '60');
      if (mins) socket.emit('admin_ban_user', { targetUserId, minutes: parseInt(mins) });
    }

    function openBroadcastPrompt() {
      const msg = prompt('全員に送信するアナウンスを入力してください:');
      if (msg) socket.emit('admin_broadcast_alert', { message: msg });
    }

    socket.on('receive_broadcast_alert', ({ title, message }) => {
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-body').innerText = message;
      document.getElementById('alert-modal-overlay').style.display = 'flex';
    });

    function closeAlertModal() { document.getElementById('alert-modal-overlay').style.display = 'none'; }
    socket.on('system_alert', (msg) => alert(msg));
    socket.on('error_message', (msg) => alert(msg));
  </script>
</body>
</html>
